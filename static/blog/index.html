        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .blog-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .blog-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
        }

        .blog-card-content {
            padding: 1.75rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-card h2 {
            font-family: 'Ubuntu', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #2c3e50;
            margin: 0 0 0.75rem 0;
            line-height: 1.3;
        }

        .blog-subtitle {
            font-style: italic;
            color: #3498db;
            font-size: 1.05rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .blog-excerpt {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .blog-read-more {
            display: inline-block;
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            align-self: flex-start;
        }

        .blog-read-more:hover {
            color: #2c3e50;
        }

        .blog-read-more::after {
            content: ' →';
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .blog-card:hover .blog-read-more::after {
            transform: translateX(4px);
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .blog-hero h1 {
                font-size: 2rem;
            }

                font-size: 1rem;
            }

        // Load blog posts with their data
        async function loadBlogPosts() {
            const blogGrid = document.getElementById('blog-grid');
            const loading = document.getElementById('loading');

            try {
                // Fetch all blog post JSON files
                const posts = await Promise.all(
                    blogPosts.map(async (post) => {
                        try {
                            const response = await fetch(`/blog/${post.slug}.json`);
                            if (!response.ok) return null;
                            const data = await response.json();
                            return { ...data, slug: post.slug };
                        } catch (error) {
                            console.error(`Error loading ${post.slug}:`, error);
                            return null;
                        }
                    })
                );

                // Filter out failed loads and create cards
                const validPosts = posts.filter(post => post !== null);
                
                loading.style.display = 'none';

                validPosts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'blog-card';

                    // Create excerpt from section1_content (first 180 characters)
                    const excerpt = post.section1_content 
                        ? post.section1_content.substring(0, 200).trim() + '...'
                        : '';

                    card.innerHTML = `
                        <div class="blog-card-content">
                            <h2>${post.title}</h2>
                            <div class="blog-subtitle">${post.subtitle || ''}</div>
                            <div class="blog-excerpt">${excerpt}</div>
                            <a href="/blog/${post.slug}" class="blog-read-more">Read More</a>
                        </div>
                    `;

                    blogGrid.appendChild(card);
                });
            } catch (error) {
                loading.textContent = 'Error loading blog posts. Please try again later.';
                console.error('Error:', error);
            }
        }

        // Load blog posts when page loads
        document.addEventListener('DOMContentLoaded', loadBlogPosts);

        body {
            font-family: 'Open Sans', sans-serif;
            background: #f8f9fa;

            padding: 0;

        .blog-hero {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 4rem 2rem 3rem 2rem;
            text-align: center;
        }

        .blog-hero h1 {
            font-family: 'Ubuntu', sans-serif;
            font-size: 3rem;
            font-weight: 300;
            margin: 0 0 1rem 0;
        }

        .blog-hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
        }

        .blog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .blog-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .blog-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
        }

        .blog-card-content {
            padding: 1.75rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-card h2 {
            font-family: 'Ubuntu', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #2c3e50;
            margin: 0 0 0.75rem 0;
            line-height: 1.3;
        }

        .blog-subtitle {
            font-style: italic;
            color: #3498db;
            font-size: 1.05rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .blog-excerpt {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .blog-read-more {
            display: inline-block;
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            align-self: flex-start;
        }

        .blog-read-more:hover {
            color: #2c3e50;
        }

        .blog-read-more::after {
            content: ' →';
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .blog-card:hover .blog-read-more::after {
            transform: translateX(4px);
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
            font-size: 1.2rem;
        }

        .blog-image-break {
            grid-column: 1 / -1;
            width: 100%;
            margin: 1rem 0;
            display: flex;
        }

        .blog-image-break img {
            width: 80%;
            max-width: 900px;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .blog-image-break.align-left {
            justify-content: flex-start;
        }

        .blog-image-break.align-center {
            justify-content: center;
        }

        .blog-image-break.align-right {
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .blog-image-break img {
                width: 100%;
                height: 250px;
            }
            
            .blog-image-break {
                justify-content: center !important;
            }
            .blog-hero h1 {
                font-size: 2rem;
            }

            .blog-hero p {
                font-size: 1rem;
            }

            .blog-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .blog-container {
                padding: 2rem 1rem;
            }
        }
    </style>

        // Load blog posts with their data
        async function loadBlogPosts() {
            const blogGrid = document.getElementById('blog-grid');
            const loading = document.getElementById('loading');

            try {
                // Fetch all blog post JSON files
                const posts = await Promise.all(
                    blogPosts.map(async (post) => {
                        try {
                            const response = await fetch(`/blog-data/${post.slug}.json`);
                            if (!response.ok) return null;
                            const data = await response.json();
                            return { ...data, slug: post.slug };
                        } catch (error) {
                            console.error(`Error loading ${post.slug}:`, error);
                            return null;
                        }
                    })
                );

                // Filter out failed loads and create cards
                const validPosts = posts.filter(post => post !== null);
                
                loading.style.display = 'none';

                // Scenic images to intersperse throughout the blog listing
                // You can change these to any images you prefer from assets/photo
                // Each image has an alignment: 'left', 'center', or 'right'
                const scenicImages = [
                    { src: '/assets/photo/bvc/Deck5.jpg', align: 'left' },
                    { src: '/assets/photo/vp/Back11.jpg', align: 'center' },
                    { src: '/assets/photo/bvc/Back4.jpg', align: 'right' },
                    { src: '/assets/photo/vp/Front4.jpg', align: 'center' },
                    { src: '/assets/photo/bvc/Deck7.jpg', align: 'left' },
                    { src: '/assets/photo/vp/Back6.jpg', align: 'right' },
                    { src: '/assets/photo/bvc/Overview2.jpg', align: 'center' },
                    { src: '/assets/photo/vp/Nook1.jpg', align: 'left' },
                    { src: '/assets/photo/bvc/Deck13.jpg', align: 'right' },
                    { src: '/assets/photo/vp/Back3.jpg', align: 'center' },
                    { src: '/assets/photo/bvc/Front1.jpg', align: 'left' },
                    { src: '/assets/photo/vp/Living_Room3.jpg', align: 'right' },
                    { src: '/assets/photo/bvc/Deck3.jpg', align: 'center' },
                    { src: '/assets/photo/vp/Overview1.jpg', align: 'left' },
                    { src: '/assets/photo/bvc/Back1.jpg', align: 'right' },
                ];

                let imageIndex = 0;
                validPosts.forEach((post, index) => {
                    const card = document.createElement('div');
                    card.className = 'blog-card';

                    // Find the question title from blogPosts array
                    const blogPostData = blogPosts.find(bp => bp.slug === post.slug);
                    const questionTitle = blogPostData ? blogPostData.title : post.title;

                    // Create excerpt from section1_content (first 180 characters)
                    const excerpt = post.section1_content 
                        ? post.section1_content.substring(0, 200).trim() + '...'
                        : '';

                    card.innerHTML = `
                        <div class="blog-card-content">
                            <h2>${questionTitle}</h2>
                            <div class="blog-subtitle">${post.subtitle || ''}</div>
                            <div class="blog-excerpt">${excerpt}</div>
                            <a href="/blog/${post.slug}" class="blog-read-more">Read More</a>
                        </div>
                    `;

                    blogGrid.appendChild(card);

                    // Add scenic image after every 9th post (3 rows of 3 panels)
                    if ((index + 1) % 9 === 0 && imageIndex < scenicImages.length) {
                        const imageBreak = document.createElement('div');
                        const imageData = scenicImages[imageIndex];
                        imageBreak.className = `blog-image-break align-${imageData.align}`;
                        imageBreak.innerHTML = `<img src="${imageData.src}" alt="Mountain retreat scenery">`;
                        blogGrid.appendChild(imageBreak);
                        imageIndex++;
                    }
                });
            } catch (error) {
                loading.textContent = 'Error loading blog posts. Please try again later.';
                console.error('Error:', error);
            }
        }

        // Load blog posts when page loads
        document.addEventListener('DOMContentLoaded', loadBlogPosts);
    </script>
